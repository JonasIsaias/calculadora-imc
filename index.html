<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="Imagens/IMC.png" type="image/x-icon">
    <title>Calculadora IMC</title>
</head>
<body>

    <div class="container">
        <h1>Calculadora de IMC</h1>

        <form id="imc-form">
            <input 
                type="number" 
                id="peso" 
                placeholder="Peso (kg)"
                step="0.1"
            >

            <input 
                type="text" 
                id="altura" 
                placeholder="Altura (Ex: 175 ou 1.75)"
            >
        </form>

        <div id="resultado" class="resultado">
            <h2>Resultado</h2>
            <p>Digite seu peso e altura.</p>
        </div>
    </div>

    <footer class="footer">
        <p>&copy; 2026 Jonas Isaias NEO. Todos os direitos reservados.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
